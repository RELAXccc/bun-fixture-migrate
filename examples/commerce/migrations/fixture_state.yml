# ----- 92 lines of fixtures/checkout.yml -----
# Checkout: how a customer pays, where the shop ships to and at what price,
# and the loyalty programme's tiers.

# The providers every shop has. Ops add local ones in the back office; the
# file never numbers them.
- model: PaymentProvider
  rows:
    - _id: stripe
      code: stripe
      kind: card
      display_name: {en: Credit card, de: Kreditkarte, fr: Carte bancaire}
      supported_currencies: [EUR, USD, GBP, CHF, SEK, PLN]
      fee_percent: 1.40
      active: true
    - _id: paypal
      code: paypal
      kind: wallet
      display_name: {en: PayPal, de: PayPal}
      supported_currencies: [EUR, USD, GBP, CHF]
      fee_percent: 2.49
      active: true
    - _id: sepa
      code: sepa
      kind: bank_transfer
      display_name: {en: Bank transfer, de: Überweisung}
      supported_currencies: [EUR]
      fee_percent: 0.35
      active: true
    - _id: klarna
      code: klarna
      kind: bnpl
      display_name: {en: Pay later with Klarna, de: Später bezahlen mit Klarna}
      supported_currencies: [EUR, SEK, GBP]
      fee_percent: 2.99
      active: true

