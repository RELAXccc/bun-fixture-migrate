# The category tree the storefront navigates, and each category's texts for
# search engines.

- model: Category
  rows:
    - _id: apparel
      id: 1
      slug: apparel
      parent_id: ~
      position: 1
      name: {en: Apparel, de: Bekleidung}
      tags: [fashion]
    - _id: womens
      id: 2
      slug: womens
      parent_id: '{{ $.Category.apparel.ID }}'
      position: 1
      name: {en: Women, de: Damen}
      tags: [fashion, women]
    - _id: mens
      id: 3
      slug: mens
      parent_id: '{{ $.Category.apparel.ID }}'
      position: 2
      name: {en: Men, de: Herren}
      tags: [fashion, men]
    - _id: kids
      id: 4
      slug: kids
      parent_id: '{{ $.Category.apparel.ID }}'
      position: 3
      name: {en: Kids, de: Kinder}
      tags: [fashion, kids]
    - _id: home
      id: 5
      slug: home
      parent_id: ~
      position: 2
      name: {en: Home & living, de: Wohnen}
      tags: []
    - _id: kitchen
      id: 6
      slug: kitchen
      parent_id: '{{ $.Category.home.ID }}'
      position: 1
      name: {en: Kitchen, de: Küche}
      tags: [home]
    - _id: living
      id: 7
      slug: living
      parent_id: '{{ $.Category.home.ID }}'
      position: 2
      name: {en: Living room, de: Wohnzimmer}
      tags: [home]
    - _id: garden
      id: 8
      slug: garden
      parent_id: '{{ $.Category.home.ID }}'
      position: 3
      name: {en: Garden, de: Garten}
      tags: [home, seasonal]
    - _id: electronics
      id: 9
      slug: electronics
      parent_id: ~
      position: 3
      name: {en: Electronics, de: Elektronik}
      tags: []
    - _id: phones
      id: 10
      slug: phones
      parent_id: '{{ $.Category.electronics.ID }}'
      position: 1
      name: {en: Phones, de: Handys}
      tags: [mobile]
    - _id: tv_audio
      id: 11
      slug: TV-Audio
      parent_id: '{{ $.Category.electronics.ID }}'
      position: 2
      name: {en: TV & audio, de: TV & Audio}
      tags: []
    - _id: cameras
      id: 12
      slug: cameras
      parent_id: '{{ $.Category.electronics.ID }}'
      position: 3
      name: {en: Cameras, de: Kameras}
      tags: [photo]

- model: CategorySEO
  rows:
    - category_id: '{{ $.Category.apparel.ID }}'
      meta_title: {en: Apparel for everyone, de: Bekleidung für alle}
      meta_description: {en: "Clothes for women, men and kids."}
      noindex: false
    - category_id: '{{ $.Category.womens.ID }}'
      meta_title: {en: Women's fashion, de: Damenmode}
      meta_description: {en: "Dresses, tops and more."}
      noindex: false
    - category_id: '{{ $.Category.mens.ID }}'
      meta_title: {en: Men's fashion, de: Herrenmode}
      meta_description: {en: "Shirts, trousers and more."}
      noindex: false
    - category_id: '{{ $.Category.home.ID }}'
      meta_title: {en: Home & living, de: Wohnen & Leben}
      meta_description: {en: Everything for your home.}
      noindex: false
    - category_id: '{{ $.Category.electronics.ID }}'
      meta_title: {en: Electronics, de: Elektronik}
      meta_description: {en: "Phones, audio and cameras."}
      noindex: true
