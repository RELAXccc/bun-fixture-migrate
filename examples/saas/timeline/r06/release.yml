description: |
  An enterprise tier. A SQL migration adds the value to the plan_tier enum, and
  the fixture adds a plan of that tier in the same release. bun runs a .up.sql
  outside a transaction, so the value is committed by the time the fixture
  migration uses it, and the deploy works. plan -with-sql runs the SQL
  migrations and the fixture migrations in one transaction, where a value added
  to an enum cannot be used, and so reports a failure the deploy will not have.
  The on-premises customer, last deployed at r01, catches up five releases in
  one migrate; staging catches up two.
steps:
  - overlay: .
  - generate: {name: enterprise plan, at: "20260601100000"}
    output:
      - "Plan: 1 insert"
      - "PlanPrice: 3 inserts"
      - "PlanFeature: 6 inserts"
      - "Translation: 3 inserts"
deploy: [prod, staging, onprem]
before_deploy:
  prod:
    # An admin re-saves the German tax rate as it is; not a change.
    - UPDATE countries SET tax_rate = 0.1900 WHERE code = 'DE'
plan:
  # Without the SQL migration the value does not exist yet.
  - cli: [plan]
    env: prod
    exit: 3
    output:
      - 'failed Plan code=enterprise insert [error]: ERROR: invalid input value for enum plan_tier: "enterprise"'
      - "pending before it and not simulated: 20260601090000_plan_tier_enterprise"
  # With it, the value exists, but in the plan's one transaction, which may
  # not use an enum value it added; the deploy commits the SQL migration
  # first. So the plan cannot tell, and says why.
  - cli: [plan, -with-sql]
    env: prod
    exit: 1
    output:
      - "20260601090000_plan_tier_enterprise (SQL): would succeed"
      - "20260601100000_fixture_enterprise_plan: could not be planned"
      - "it uses an enum value a migration before it in this plan added"
  - cli: [plan, -with-sql]
    env: onprem
    exit: 1
    output:
      - "20260309090000_plans_trial_days (SQL): would succeed"
      - "20260504090000_roles_master_id_range (SQL): would succeed"
      - 'unsafe use of new value "enterprise" of enum type plan_tier'
  # The plan was rolled back, but the setval of a SQL migration it ran was
  # not: the sequence of on-premises roles has moved already.
  - sql: SELECT last_value::text FROM roles_id_seq
    env: onprem
    want: "10000"
    known: "F6: plan -with-sql leaves the non-transactional effects of the SQL migrations it ran"
