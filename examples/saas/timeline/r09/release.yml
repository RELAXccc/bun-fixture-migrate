description: |
  The category tree is rearranged. The integrations root becomes the platform
  root: its slug changes under renames: update, so its children keep pointing
  at it. The analytics subtree (analytics, dashboards, exports) moves under it;
  only the subtree root's parent changes. A developer tools root with an SDKs
  child is added. In production an admin renames the dashboards category
  meanwhile, which check reports as drift after the deploy. Production is
  deployed from three replicas at once: bun's migrator lock does not wait, so
  the application retries it (SAAS_LOCK_WAIT), and exactly one replica
  migrates. The probe moves the API subtree under the new developer tools
  category instead, which every command that reads the database then fails on.
steps:
  - overlay: .
  - generate: {name: platform categories, at: "20260824100000"}
    output: ["Category: 2 inserts, 3 updates"]
deploy: [prod]
replicas: 3
before_deploy:
  prod:
    - UPDATE categories SET name = 'Dashboards & reports' WHERE slug = 'dashboards'
plan:
  - cli: [plan, -strict]
    env: prod
    output:
      - "applied Category slug=integrations update (1 row)"
      - "applied Category slug=developer-tools insert (1 row)"
      - "applied Category slug=analytics update (1 row)"
  # A replica is in the middle of a deploy, or died in one: bun's lock row
  # is there. bun's Lock fails at once rather than wait for it.
  - sql: INSERT INTO bun_migration_locks (table_name) VALUES ('bun_migrations')
    env: prod
  - app: [migrate]
    env: prod
    vars: [SAAS_LOCK_WAIT=0]
    exit: 1
    known: "F7: bun's migrator lock does not wait, and a crashed deploy leaves it taken; the docs say it serialises replicas"
    output: ["migrate: migrations table is already locked"]
  - sql: DELETE FROM bun_migration_locks
    env: prod
expect:
  check:
    prod:
      exit: 3
      output: ["Category slug=dashboards", "name: database Dashboards & reports, file Dashboards"]
known:
  - "F8: the database snapshot reads rows in text order of the id (1, 10, 2, ...) and resolves a self-reference only to rows read before it, so a child read before its parent breaks check, export, sync and generate -from-db. The main line moves a subtree whose root sorts after its new parent, and numbers the new categories 10 and 11 rather than 9 and 10"
probes:
  - name: the API subtree under a new category
    from: start
    when: before-deploy
    known: "F8"
    clone: prod
    steps:
      - overlay: probe-api-subtree
      - generate: {name: developer tools, at: "20260824100000"}
        env: prod
        output: ["Category: 1 insert, 1 update"]
      - app: [migrate]
        env: clone
        output: ["Category slug=api update: applied (1 row)"]
      - cli: [check]
        env: clone
        exit: 1
        output: ["Category: parent_id = 9 points at a row of Category that this snapshot does not hold"]
      - cli: [export, -stdout]
        env: clone
        exit: 1
        output: ["points at a row of Category that this snapshot does not hold"]
