- model: Feature
  rows:
    - _id: projects
      id: 1
      code: projects
      name: Projects
      unit: projects
    - _id: storage
      id: 2
      code: storage
      name: Storage
      unit: GB
    - _id: api
      id: 3
      code: api
      name: API calls
      unit: requests/month
    - _id: sso
      id: 4
      code: sso
      name: Single sign-on
    - _id: audit_log
      id: 6
      code: audit_log
      name: Audit log

- model: PlanFeature
  rows:
    - plan_id: '{{ $.Plan.free.ID }}'
      feature_id: '{{ $.Feature.projects.ID }}'
      quota: 5
    - plan_id: '{{ $.Plan.free.ID }}'
      feature_id: '{{ $.Feature.storage.ID }}'
      quota: 1
    - plan_id: '{{ $.Plan.team.ID }}'
      feature_id: '{{ $.Feature.projects.ID }}'
      quota: 50
