# What is sold: plans, their prices and features, and the category tree.

- model: Plan
  rows:
    - _id: free
      code: free
      name: Free
      tier: free
      active: true
      sort_order: 1
      trial_days: 0
      settings: {max_projects: 3, support: community}
      tags: [starter]
    - _id: team
      code: team
      name: Team
      tier: team
      active: true
      sort_order: 2
      trial_days: 14
      settings: {max_projects: 50, support: email, sso: false}
      tags: [popular, monthly]
    - _id: business
      code: business
      name: Business
      tier: business
      active: true
      sort_order: 3
      trial_days: 30
      settings: {max_projects: 500, support: phone, sso: true, audit: {retention_days: 90}}
      tags: [annual]
    - _id: scale
      code: scale
      name: Scale
      tier: business
      active: false
      sort_order: 4
      trial_days: 30
      settings: {max_projects: 5000, support: dedicated, sso: true, audit: {retention_days: 365}}
      tags: [annual, enterprise-ready]
    - _id: enterprise
      code: enterprise
      name: Enterprise
      tier: enterprise
      active: true
      sort_order: 5
      trial_days: 30
      settings: {max_projects: null, support: dedicated, sso: true, audit: {retention_days: 3650}, sla: "99.95"}
      tags: [annual, contract]

- model: PlanPrice
