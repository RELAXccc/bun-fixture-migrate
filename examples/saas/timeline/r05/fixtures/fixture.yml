      id: 1
      slug: integrations
      name: Integrations
      position: 1
    - _id: api
      id: 2
      slug: api
      parent_id: '{{ $.Category.integrations.ID }}'
      name: API
      position: 1
    - _id: rest
      id: 3
      slug: rest
      parent_id: '{{ $.Category.api.ID }}'
      name: REST
      position: 1
    - _id: graphql
      id: 4
      slug: graphql
      parent_id: '{{ $.Category.api.ID }}'
      name: GraphQL
      position: 2
    - _id: webhooks
      id: 5
      slug: webhooks
      parent_id: '{{ $.Category.integrations.ID }}'
      name: Webhooks
      position: 2
    - _id: analytics
      id: 6
      slug: analytics
      name: Analytics
      position: 2
    - _id: dashboards
      id: 7
      slug: dashboards
      parent_id: '{{ $.Category.analytics.ID }}'
      name: Dashboards
      position: 1
    - _id: exports
      id: 8
      slug: exports
      parent_id: '{{ $.Category.analytics.ID }}'
      name: Exports
      position: 2
