# Master data of the SaaS application, loaded by dbfixture into a new
# database. Every change to it comes with a migration generated by
# bun-fixture-migrate.

- model: Currency
  rows:
    - _id: eur
      id: 1
      code: EUR
      name: Euro
      symbol: "€"
      minor_units: 2
    - _id: usd
      id: 2
      code: USD
      name: US dollar
      symbol: "$"
      minor_units: 2
    - _id: jpy
      id: 3
      code: JPY
      name: Japanese yen
      symbol: "¥"
      minor_units: 0
    - _id: chf
      id: 4
      code: CHF
      name: Swiss franc
      symbol: CHF
      minor_units: 2

- model: Country
  rows:
    - _id: de
      id: 1
      code: DE
      name: Deutschland
      currency_id: '{{ $.Currency.eur.ID }}'
      tax_rate: 0.19
    - _id: fr
      id: 2
      code: FR
      name: France
      currency_id: '{{ $.Currency.eur.ID }}'
      tax_rate: 0.2
    - _id: us
      id: 3
      code: US
      name: United States
      currency_id: '{{ $.Currency.usd.ID }}'
      tax_rate: 0
    - _id: jp
      id: 4
      code: JP
      name: 日本
      currency_id: '{{ $.Currency.jpy.ID }}'
      tax_rate: 0.1
    - _id: ch
      id: 5
      code: CH
      name: Schweiz
      currency_id: '{{ $.Currency.chf.ID }}'
      tax_rate: 0.081

- model: Plan
  rows:
    - _id: free
      code: free
      name: Free
      tier: free
      active: true
      sort_order: 1
      trial_days: 0
      settings: {max_projects: 3, support: community}
      tags: [starter]
    - _id: team
      code: team
      name: Team
      tier: team
      active: true
      sort_order: 2
      trial_days: 14
      settings: {max_projects: 50, support: email, sso: false}
      tags: [popular, monthly]
    - _id: business
      code: business
      name: Business
      tier: business
      active: true
      sort_order: 3
      trial_days: 30
      settings: {max_projects: 500, support: phone, sso: true, audit: {retention_days: 90}}
      tags: [annual]
    - _id: scale
      code: scale
      name: Scale
      tier: business
      active: true
      sort_order: 4
      trial_days: 30
      settings: {max_projects: 5000, support: dedicated, sso: true, audit: {retention_days: 365}}
      tags: [annual, enterprise-ready]

- model: PlanPrice
  rows:
    - plan_id: '{{ $.Plan.free.ID }}'
      currency_id: '{{ $.Currency.eur.ID }}'
      valid_from: 2026-01-01
      amount: 0
    - plan_id: '{{ $.Plan.team.ID }}'
      currency_id: '{{ $.Currency.eur.ID }}'
      valid_from: 2026-01-01
      amount: 29.00
    - plan_id: '{{ $.Plan.team.ID }}'
      currency_id: '{{ $.Currency.usd.ID }}'
      valid_from: 2026-01-01
      amount: 32.00
    - plan_id: '{{ $.Plan.team.ID }}'
      currency_id: '{{ $.Currency.eur.ID }}'
      valid_from: 2026-04-01
      amount: 35.00
    - plan_id: '{{ $.Plan.team.ID }}'
      currency_id: '{{ $.Currency.usd.ID }}'
      valid_from: 2026-04-01
      amount: 38.00
    - plan_id: '{{ $.Plan.business.ID }}'
      currency_id: '{{ $.Currency.eur.ID }}'
      valid_from: 2026-01-01
      amount: 99.00
    - plan_id: '{{ $.Plan.business.ID }}'
      currency_id: '{{ $.Currency.usd.ID }}'
      valid_from: 2026-01-01
      amount: 109.00
    - plan_id: '{{ $.Plan.business.ID }}'
      currency_id: '{{ $.Currency.jpy.ID }}'
      valid_from: 2026-01-01
      amount: 15000
    - plan_id: '{{ $.Plan.scale.ID }}'
      currency_id: '{{ $.Currency.eur.ID }}'
      valid_from: 2026-03-01
      amount: 199.00
    - plan_id: '{{ $.Plan.scale.ID }}'
      currency_id: '{{ $.Currency.usd.ID }}'
      valid_from: 2026-03-01
      amount: 219.00

- model: Feature
  rows:
    - _id: projects
      id: 1
      code: projects
      name: Projects
      unit: projects
    - _id: storage
      id: 2
      code: storage
      name: Storage
      unit: GB
    - _id: api
      id: 3
      code: api
      name: API calls
      unit: requests/month
    - _id: sso
      id: 4
      code: sso
      name: Single sign-on
    - _id: priority_support
      id: 5
      code: priority_support
      name: Priority support
    - _id: audit_log
      id: 6
      code: audit_log
      name: Audit log

- model: PlanFeature
  rows:
    - plan_id: '{{ $.Plan.free.ID }}'
      feature_id: '{{ $.Feature.projects.ID }}'
      quota: 5
    - plan_id: '{{ $.Plan.free.ID }}'
      feature_id: '{{ $.Feature.storage.ID }}'
      quota: 1
    - plan_id: '{{ $.Plan.team.ID }}'
      feature_id: '{{ $.Feature.projects.ID }}'
      quota: 50
    - plan_id: '{{ $.Plan.team.ID }}'
      feature_id: '{{ $.Feature.storage.ID }}'
      quota: 200
    - plan_id: '{{ $.Plan.team.ID }}'
      feature_id: '{{ $.Feature.api.ID }}'
      quota: 100000
    - plan_id: '{{ $.Plan.business.ID }}'
      feature_id: '{{ $.Feature.projects.ID }}'
      quota: ~
    - plan_id: '{{ $.Plan.business.ID }}'
      feature_id: '{{ $.Feature.storage.ID }}'
      quota: 1000
    - plan_id: '{{ $.Plan.business.ID }}'
      feature_id: '{{ $.Feature.api.ID }}'
      quota: ~
    - plan_id: '{{ $.Plan.business.ID }}'
      feature_id: '{{ $.Feature.sso.ID }}'
    - plan_id: '{{ $.Plan.business.ID }}'
      feature_id: '{{ $.Feature.priority_support.ID }}'
    - plan_id: '{{ $.Plan.business.ID }}'
      feature_id: '{{ $.Feature.audit_log.ID }}'
    - plan_id: '{{ $.Plan.scale.ID }}'
      feature_id: '{{ $.Feature.projects.ID }}'
    - plan_id: '{{ $.Plan.scale.ID }}'
      feature_id: '{{ $.Feature.storage.ID }}'
      quota: 5000
    - plan_id: '{{ $.Plan.scale.ID }}'
      feature_id: '{{ $.Feature.api.ID }}'
    - plan_id: '{{ $.Plan.scale.ID }}'
      feature_id: '{{ $.Feature.sso.ID }}'
    - plan_id: '{{ $.Plan.scale.ID }}'
      feature_id: '{{ $.Feature.priority_support.ID }}'
    - plan_id: '{{ $.Plan.scale.ID }}'
      feature_id: '{{ $.Feature.audit_log.ID }}'

- model: Role
  rows:
    - _id: owner
      id: 1
      code: owner
      name: Owner
    - _id: admin
      id: 2
      code: admin
      name: Administrator
    - _id: member
      id: 3
      code: member
      name: Member
    - _id: viewer
      id: 4
      code: viewer
      name: Viewer
    - _id: billing_admin
      id: 100
      code: billing_admin
      name: Billing administrator

- model: Permission
  rows:
    - _id: billing_read
      id: 1
      code: billing.read
      description: See invoices and the subscription
    - _id: billing_write
      id: 2
      code: billing.manage
      description: Change the plan, the payment method and the billing address
    - _id: users_manage
      id: 3
      code: users.manage
      description: Invite, remove and change users
    - _id: projects_write
      id: 4
      code: projects.write
      description: Create and change projects
    - _id: projects_read
      id: 5
      code: projects.read
      description: See projects
    - _id: reports_export
      id: 6
      code: reports.export
      description: Export reports as CSV

- model: RolePermission
  rows:
    - {role_id: '{{ $.Role.owner.ID }}', permission_id: '{{ $.Permission.billing_read.ID }}'}
    - {role_id: '{{ $.Role.owner.ID }}', permission_id: '{{ $.Permission.billing_write.ID }}'}
    - {role_id: '{{ $.Role.owner.ID }}', permission_id: '{{ $.Permission.users_manage.ID }}'}
    - {role_id: '{{ $.Role.owner.ID }}', permission_id: '{{ $.Permission.projects_write.ID }}'}
    - {role_id: '{{ $.Role.owner.ID }}', permission_id: '{{ $.Permission.projects_read.ID }}'}
    - {role_id: '{{ $.Role.owner.ID }}', permission_id: '{{ $.Permission.reports_export.ID }}'}
    - {role_id: '{{ $.Role.admin.ID }}', permission_id: '{{ $.Permission.billing_read.ID }}'}
    - {role_id: '{{ $.Role.admin.ID }}', permission_id: '{{ $.Permission.users_manage.ID }}'}
    - {role_id: '{{ $.Role.admin.ID }}', permission_id: '{{ $.Permission.projects_write.ID }}'}
    - {role_id: '{{ $.Role.admin.ID }}', permission_id: '{{ $.Permission.projects_read.ID }}'}
    - {role_id: '{{ $.Role.member.ID }}', permission_id: '{{ $.Permission.projects_write.ID }}'}
    - {role_id: '{{ $.Role.member.ID }}', permission_id: '{{ $.Permission.projects_read.ID }}'}
    - {role_id: '{{ $.Role.viewer.ID }}', permission_id: '{{ $.Permission.projects_read.ID }}'}
    - {role_id: '{{ $.Role.billing_admin.ID }}', permission_id: '{{ $.Permission.billing_read.ID }}'}
    - {role_id: '{{ $.Role.billing_admin.ID }}', permission_id: '{{ $.Permission.billing_write.ID }}'}

- model: Translation
  rows:
    - {locale: en, key: plan.free.name, value: Free}
    - {locale: en, key: plan.team.name, value: Team}
    - {locale: en, key: plan.business.name, value: Business}
    - {locale: en, key: plan.scale.name, value: Scale}
    - {locale: en, key: nav.billing, value: Billing & invoices}
    - {locale: en, key: nav.settings, value: Settings}
    - {locale: en, key: errors.quota_exceeded, value: "You have used all {{quota}} of your plan's {{feature}}."}
    - locale: en
      key: email.welcome.subject
      value: Welcome to Acme!
    - locale: en
      key: email.welcome.body
      value: |
        Hi {name},

        welcome to Acme. Your workspace "{workspace}" is ready.
        Questions? Reply to this e-mail — a human reads it.
      context: Plain-text e-mail; keep the placeholders.
    - {locale: de, key: plan.free.name, value: Kostenlos}
    - {locale: de, key: plan.team.name, value: Team}
    - {locale: de, key: plan.business.name, value: Business}
    - {locale: de, key: plan.scale.name, value: Scale}
    - {locale: de, key: nav.billing, value: Abrechnung}
    - {locale: de, key: nav.settings, value: Einstellungen}
    - {locale: de, key: errors.quota_exceeded, value: "Sie haben alle {{quota}} {{feature}} Ihres Tarifs verbraucht."}
    - locale: de
      key: email.welcome.subject
      value: Willkommen an Bord, {name}!
      context: Subject line of the welcome e-mail, at most 60 characters.
    - locale: de
      key: email.welcome.body
      value: |
        Hallo {name},

        willkommen bei Acme. Dein Arbeitsbereich „{workspace}“ ist bereit.
        Fragen? Antworte einfach auf diese E-Mail – hier liest ein Mensch mit. 🙂
      context: Plain-text e-mail; keep the placeholders.
    - {locale: fr, key: plan.free.name, value: Gratuit}
    - {locale: fr, key: plan.team.name, value: Équipe}
    - {locale: fr, key: plan.business.name, value: Entreprise}
    - {locale: fr, key: plan.scale.name, value: Scale}
    - {locale: fr, key: nav.billing, value: Facturation}
    - {locale: fr, key: nav.settings, value: Paramètres}
    - {locale: fr, key: errors.quota_exceeded, value: "Vous avez utilisé les {{quota}} {{feature}} de votre forfait."}
    - locale: fr
      key: email.welcome.subject
      value: "Bienvenue chez Acme !"
    - locale: fr
      key: email.welcome.body
      value: |
        Bonjour {name},

        bienvenue chez Acme. Votre espace « {workspace} » est prêt.
        Une question ? Répondez à cet e-mail : un humain le lit.
      context: Plain-text e-mail; keep the placeholders.

