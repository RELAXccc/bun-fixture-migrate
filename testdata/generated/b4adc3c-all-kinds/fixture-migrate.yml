# The configuration the change set beside it was generated with.
fixture: fixture.yml
out: migrations
package: migrations
migrator: Migrations
seed_guard_table: corpus_plans
lock_timeout: 5s
policy:
  renames: update
  duplicate_key: warn
models:
  Currency:
    table: corpus_currencies
    key: [code]
    ref: code
    deletes: cascade
  Plan:
    table: corpus_plans
    serial: true
    key: [name]
    references: {currency_id: Currency}
    defaults: {note: ~}
  Feature:
    table: corpus_features
    serial: true
    key: [plan_id, code]
    references: {plan_id: Plan}
